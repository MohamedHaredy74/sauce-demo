name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'
          cache: maven

      - name: Run tests
        run: mvn -B -ntp clean test -Dheadless=true -DbrowserType=${{ matrix.browser }}

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: target/allure-results
          if-no-files-found: warn

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.browser }}
          path: logs
          if-no-files-found: ignore

  report:
    name: Allure report
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK (Allure CLI needs Java)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: results

      - name: Install Allure CLI
        run: npm install -g allure-commandline

      - name: Generate one report per browser
        run: |
          mkdir -p site
          for dir in results/allure-results-*; do
            browser="${dir#results/allure-results-}"
            allure generate "$dir" --clean -o "site/$browser"
          done
          {
            echo '<!doctype html><meta charset="utf-8"><title>Allure reports</title>'
            echo '<h1>WebAutomation Demo - Allure reports</h1><ul>'
            for dir in site/*/; do
              name="$(basename "$dir")"
              echo "<li><a href=\"$name/\">$name</a></li>"
            done
            echo '</ul>'
          } > site/index.html

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: site

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    needs: report
    if: always() && needs.report.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
