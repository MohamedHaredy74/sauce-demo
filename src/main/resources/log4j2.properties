status = warn
name = SeleniumAutomationFrameworkConfig
packages = utils

# ============================================================
# Properties
# ============================================================

property.logDir = logs
property.logFileName = execution.log

# ============================================================
# Appenders
# ============================================================

# ---------------- Console Appender ----------------

appender.console.type = Console
appender.console.name = Console
appender.console.target = SYSTEM_OUT

appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5level [%t] %c{1} - %msg%n


# ---------------- Rolling File Appender ----------------

appender.file.type = RollingFile
appender.file.name = RollingFile
appender.file.fileName = ${logDir}/${logFileName}
appender.file.filePattern = ${logDir}/automation-%d{yyyy-MM-dd}-%i.log.gz

appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5level [%t] %c{1} - %msg%n

# Roll over when file reaches 10 MB
appender.file.policies.type = Policies

appender.file.policies.size.type = SizeBasedTriggeringPolicy
appender.file.policies.size.size = 10MB

# Keep the last 7 rolled files
appender.file.strategy.type = DefaultRolloverStrategy
appender.file.strategy.max = 7

# ---------------- Test Log Capture Appender (for Allure attachment) ----------------

appender.testCapture.type = TestLogCaptureAppender
appender.testCapture.name = TestCapture

appender.testCapture.layout.type = PatternLayout
appender.testCapture.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5level [%t] %c{1} - %msg%n


# ============================================================
# Root Logger
# ============================================================

rootLogger.level = info

rootLogger.appenderRefs = console, file, testCapture

rootLogger.appenderRef.console.ref = Console
rootLogger.appenderRef.file.ref = RollingFile
rootLogger.appenderRef.testCapture.ref = TestCapture


# ============================================================
# Framework Logger
# ============================================================

logger.framework.name = com.sauce-demo.automation
logger.framework.level = debug
logger.framework.additivity = false

logger.framework.appenderRefs = console, file, testCapture
logger.framework.appenderRef.console.ref = Console
logger.framework.appenderRef.file.ref = RollingFile
logger.framework.appenderRef.testCapture.ref = TestCapture


# ============================================================
# Selenium Logger
# ============================================================

logger.selenium.name = org.openqa.selenium
logger.selenium.level = warn
logger.selenium.additivity = false

logger.selenium.appenderRefs = console, file
logger.selenium.appenderRef.console.ref = Console
logger.selenium.appenderRef.file.ref = RollingFile